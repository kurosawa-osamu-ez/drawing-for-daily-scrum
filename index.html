<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>ファシリテーターくじ引き</title>
  <script src="./index.js" defer></script>
  <link rel="stylesheet" href="./style.css" type="text/css" />
</head>

<body>
  <h1><span>次回のファシリテーター</span></h1>
  <div class="container">
    <!-- 画面演出用レイヤー -->
    <div id="effects" aria-hidden="true">
      <div id="fxBlackout" class="fx-layer"></div>
      <div id="fxSpotlight" class="fx-layer"></div>
      <div id="fxFlash" class="fx-layer"></div>
      <div id="fxGold" class="fx-layer"></div>
      <div id="fxStars" class="fx-layer"></div>
      <div id="fxFireworks" class="fx-layer"></div>
      <div id="confetti" class="fx-layer"></div>
      <div id="fxGif" class="fx-layer"></div>
    </div>

    <!-- 欠席者除外（チェックを外す） -->
    <section id="participantsPanel" class="panel" aria-label="参加者の選択">
      <div class="panel-header">
        <h2 class="panel-title">対象者</h2>
        <div class="panel-actions">
          <button id="selectAll" class="mini-btn" type="button">全員</button>
          <button id="selectNone" class="mini-btn" type="button">全員解除</button>
        </div>
      </div>
      <div id="participants" class="participants"></div>
      <div class="participants-footer">
        <span id="selectedCount">0</span> 人が対象
      </div>
    </section>

    <!-- 縦向きルーレット -->
    <section id="roulettePanel" class="panel" aria-label="ルーレット">
      <div class="roulette-window" role="region" aria-label="ルーレット表示">
        <div class="roulette-indicator" aria-hidden="true"></div>
        <div id="rouletteRoll" class="roulette-roll"></div>
      </div>
    </section>

    <div id="result-container">
      <h2><span id="result">スタートを押してください</span></h2>
    </div>
    <div id="controls" class="btn-border-gradient-wrap btn-border-gradient-wrap--gold">
      <a id="startButton" onclick="startRoulette()" class="btn btn-border-gradient"><span
          class="btn-text-gradient--gold">スタート</span></a>
    </div>
  </div>
</body>

</html>
